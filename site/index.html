<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kotoba 言葉</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E0E0E'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23C8102E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-wave" aria-hidden="true"></div>
  <div class="side-accent" aria-hidden="true"><span lang="ja">日本語を学ぶ</span></div>
  <header class="topbar">
    <a href="#/" class="logo" aria-label="Kotoba home">
      <span class="sun"></span>
      <span class="logo-jp" lang="ja">言葉</span>
      <span class="logo-en">Kotoba</span>
    </a>
    <div class="streak" id="streak"></div>
  </header>
  <main id="app"><div class="loading"><span class="sun pulse"></span></div></main>
  <div id="syncbar" role="status" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
